spring:
  application:
    name: stylo-flow
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        multiTenancy: SCHEMA
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT}

app:
  time-zone: ${APP_TIMEZONE}
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS}
    issuer: stylo-flow
  cors:
    origins: ${CORS_ORIGINS}
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    name: Administrator
  cloudinary:
    url: ${CLOUDINARY_URL}
  superadmin:
    username: ${SUPERADMIN_USERNAME}
    password: ${SUPERADMIN_PASSWORD}
    name: Platform administrator

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
