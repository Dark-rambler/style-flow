spring:
  application:
    name: stylo-flow
  config:
    # Reutiliza el .env de la raíz del repo (formato KEY=VALUE)
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/stylo}
    username: ${DB_USER:stylo}
    password: ${DB_PASSWORD:stylo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8085}
  error:
    include-stacktrace: never

app:
  zona-horaria: ${APP_TIMEZONE:America/La_Paz}
  jwt:
    secret: ${JWT_SECRET:dev-secret-cambiar-en-produccion-minimo-32-caracteres!!}
    expiration-hours: ${JWT_EXPIRATION_HOURS:8}
    issuer: stylo-flow
  cors:
    origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    nombre: Administrador
  superadmin:
    username: ${SUPERADMIN_USERNAME:superadmin}
    password: ${SUPERADMIN_PASSWORD:superadmin123}
    nombre: Administrador de plataforma

springdoc:
  swagger-ui:
    path: /swagger-ui.html
